
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload College Logo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container narrow">
        <section class="card">
            <h2>Upload College Logo</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">
                <label>Select logo image</label>
                <input type="file" name="logo" accept=".png,.jpg,.jpeg,.gif,.webp" required>
                <button type="submit" class="btn full">Upload Logo</button>
            </form>

            <p><a href="{{ url_for('index') }}">Back to Home</a></p>
        </section>
    </main>
</body>
</html>
