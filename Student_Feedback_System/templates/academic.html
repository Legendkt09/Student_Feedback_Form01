{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h2>Academic Year</h2>

    <p class="subtitle">
        Select Academic Year
    </p>

    <form method="POST">

        {% for year in academic_years %}

        <label class="option-card">

            <input
                type="radio"
                name="academic_year"
                value="{{ year }}"
                required
            >

            <span>
                {{ year }}
            </span>

        </label>

        {% endfor %}

        <div class="button-row">

            <a
                href="{{ url_for('index') }}"
                class="back-button">
                ← Back
            </a>

            <button
                type="submit"
                class="next-button">
                Next →
            </button>

        </div>

    </form>

</div>

{% endblock %}
