{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h2>Department</h2>

    <p class="subtitle">
        Select Department
    </p>

    <form method="POST">

        {% for department in departments %}

        <label class="option-card">

            <input
                type="radio"
                name="department"
                value="{{ department }}"
                required
            >

            <span>
                {{ department }}
            </span>

        </label>

        {% endfor %}

        <div class="button-row">

            <a
                href="{{ url_for('semester') }}"
                class="back-button">
                ← Back
            </a>

            <button
                type="submit"
                class="next-button">
                Next →
            </button>

        </div>

    </form>

</div>

{% endblock %}
