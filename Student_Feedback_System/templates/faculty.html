{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h2>Faculty Name</h2>

    <p class="subtitle">
        Select Faculty Member
    </p>

    <form method="POST">

        {% for faculty in faculties %}

        <label class="option-card">

            <input
                type="radio"
                name="faculty"
                value="{{ faculty }}"
                required
            >

            <span>
                {{ faculty }}
            </span>

        </label>

        {% endfor %}

        <div class="button-row">

            <a
                href="{{ url_for('subject') }}"
                class="back-button">
                ← Back
            </a>

            <button
                type="submit"
                class="next-button">
                Next →
            </button>

        </div>

    </form>

</div>

{% endblock %}
